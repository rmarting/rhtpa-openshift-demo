# Red Hat build of Keycloak. stable-v26 is the long-lived 26.x channel in the
# redhat-operators catalog (the API used here is k8s.keycloak.org/v2beta1).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  labels:
    app.kubernetes.io/part-of: keycloak
spec:
  channel: stable-v26
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
