# Package rhtpa-operator. The bundle default channel is stable-v1.1 (the 2.x line).
# Version 3.1.1 is published on stable-v3. Manual approval keeps the cluster on
# the InstallPlan for rhtpa-operator.v3.1.1 until you approve a later plan.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtpa-operator
  labels:
    app.kubernetes.io/part-of: rhtpa
spec:
  channel: stable-v3
  name: rhtpa-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: rhtpa-operator.v3.1.1
  installPlanApproval: Automatic
