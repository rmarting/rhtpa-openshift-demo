# Lab credentials. Change every value before the routes are reachable by anyone else.
---
apiVersion: v1
kind: Secret
metadata:
  name: rhtpa-db
  labels:
    app.kubernetes.io/name: rhtpa-postgresql
    app.kubernetes.io/part-of: rhtpa
type: Opaque
stringData:
  # Superuser used by the operator create-database and migrate jobs.
  postgres-password: postgres-lab-pass
  # Application role created in the trustify database.
  username: trustify
  password: trustify-lab-pass
  database: trustify
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  labels:
    app.kubernetes.io/name: keycloak-postgresql
    app.kubernetes.io/part-of: keycloak
type: Opaque
stringData:
  username: keycloak
  password: keycloak-lab-pass
  admin-password: keycloak-admin-lab-pass
  database: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-initial-admin
  labels:
    app.kubernetes.io/name: keycloak-sso
    app.kubernetes.io/part-of: keycloak
type: Opaque
stringData:
  # Master-realm console at https://<keycloak-host>/admin
  username: admin
  password: admin123456
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-cli
  labels:
    app.kubernetes.io/part-of: keycloak
type: Opaque
stringData:
  # Confidential client "cli" in the trustify realm. Same lab value as the
  # RHTPA 3.1 deployment guide examples.
  client-secret: 5460cc91-4e20-4edd-881c-b15b169f8a79
---
apiVersion: v1
kind: Secret
metadata:
  name: rhtpa-users
  labels:
    app.kubernetes.io/part-of: rhtpa
type: Opaque
stringData:
  admin-password: admin123456
  analyst-password: analyst123456
