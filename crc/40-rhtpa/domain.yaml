apiVersion: rhtpa.io/v1
kind: TrustedProfileAnalyzer
metadata:
  name: rhtpa
spec:
  appDomain: -trusted-profile-analyzer.apps-crc.testing
  oidc:
    issuerUrl: https://sso-trusted-profile-analyzer.apps-crc.testing/realms/trustify
  storage:
    type: filesystem
    size: 10Gi
  ingress:
    className: openshift-default
    additionalAnnotations:
      haproxy.router.openshift.io/timeout: 5m    
  tls:
    additionalTrustAnchor: /etc/trust-anchor/tls.crt
  extraVolumes:
    - name: trust-anchor
      configMap:
        name: ingress-ca
    - name: rhtpa-rhlw-creds
      secret:
        secretName: rhtpa-rhlw-creds
  extraVolumeMounts:
    - name: trust-anchor
      mountPath: /etc/trust-anchor
      readOnly: true
    - name: rhtpa-rhlw-creds
      mountPath: /run/secrets/rhtpa-rhlw-creds
      readOnly: true