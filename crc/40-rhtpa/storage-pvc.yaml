kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: storage
  finalizers:
    - kubernetes.io/pvc-protection
  labels:
    type: importer-working-directory
    app.kubernetes.io/part-of: rhtpa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
